<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Classic triangular recycle: three arrows chasing clockwise around a triangle. -->
  <!-- Arrow 1: top → bottom-right -->
  <line x1="10" y1="4" x2="14.5" y2="12"/>
  <polyline points="13,11.5 14.5,12 14,10.5"/>
  <!-- Arrow 2: bottom-right → bottom-left (along the bottom) -->
  <line x1="14.5" y1="14" x2="5.5" y2="14"/>
  <polyline points="7,13 5.5,14 7,15"/>
  <!-- Arrow 3: bottom-left → top -->
  <line x1="5.5" y1="12" x2="10" y2="4"/>
  <polyline points="8.5,4.5 10,4 10,5.5"/>
</svg>
