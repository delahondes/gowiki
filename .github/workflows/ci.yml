name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit arrives —
# no point burning compute on a rev the reviewer has already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # Postgres service container — the integration-tagged tests need a
    # live DB (DataStore, SchemaStore, DatabaseSync, HTTP handlers, MCP
    # tools). Unit-only tests are unaffected and still run without it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gowiki
          POSTGRES_PASSWORD: gowiki
          POSTGRES_DB: gowiki_test
        ports:
          - 5432:5432
        # `pg_isready` polling — the job proceeds only once the DB
        # accepts connections. Without this, the first test race-loses
        # to a still-initialising Postgres.
        options: >-
          --health-cmd "pg_isready -U gowiki -d gowiki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gowiki:gowiki@localhost:5432/gowiki_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: golangci-lint (includes gofmt + govet + staticcheck + unused + ineffassign)
        # v7 is the first tag that supports golangci-lint v2's config schema.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: backend
          args: --timeout=5m
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: go test (unit)
        working-directory: backend
        run: go test -race -timeout 5m ./...
      - name: go test (integration — Postgres-backed)
        working-directory: backend
        run: go test -race -tags=integration -timeout 10m ./...

  frontend:
    name: Frontend (TS + Vite + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        # `npm ci` demands a lockfile. If the lockfile is missing (early
        # in a repo's life) fall back to `npm install` — the failure is
        # informative so CI still shows the drift.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: prettier --check
        working-directory: frontend
        run: npm run format:check
      - name: vite build
        working-directory: frontend
        run: npx vite build
      - name: vitest
        working-directory: frontend
        run: npm test
